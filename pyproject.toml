[project]
name = "kuromi"
version = "0.1.0"
description = "Discord bot"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "py-cord>=2.8.1",
    "python-dotenv>=1.2.3",
]

[project.scripts]
kuromi = "kuromi.bot:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
